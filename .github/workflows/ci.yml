# Pipeline estándar de Zordon (standards/pipeline.md), generado por `zordon adopt`.
name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
      - run: composer install
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: composer lint
      - run: composer build
      - run: vendor/bin/phpunit
      - run: bin/e2e
